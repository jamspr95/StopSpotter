name: Sync England & Wales title boundaries

on:
  schedule:
    # HMLR publishes INSPIRE Index Polygons on ~the 6th of each month — run
    # on the 7th (03:00 UTC) so that day's publish has already landed.
    - cron: '0 3 7 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (parse and log, write nothing)'
        type: boolean
        default: false
      council:
        description: 'Only this council (substring match); leave blank for --all'
        type: string
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ~380 local authorities, one HTTP fetch + parse each
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          ARGS="--all"
          if [ -n "${{ inputs.council }}" ]; then
            ARGS="--council=${{ inputs.council }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/sync-title-boundaries-ew.mjs $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
